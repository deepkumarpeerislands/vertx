plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.deep'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot Vert.x'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'io.vertx:vertx-core:4.5.9'
	implementation 'io.vertx:vertx-web:4.5.9'
	implementation 'io.vertx:vertx-web-client:4.5.9'
	implementation 'io.vertx:vertx-web-openapi:4.5.9'
	implementation 'io.vertx:vertx-web-validation:4.5.9'
	implementation 'io.vertx:vertx-json-schema:4.5.9'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.vertx:vertx-junit5:4.5.9'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
